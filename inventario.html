<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário</title>
    <style>
        :root {
            --bg-color: #fdfaf3;
            --card-color: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #b11f2d;
            --border-color: #d1d1d1;
        }
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px;
            margin: 0;
            max-width: 600px;
            margin: auto;
        }

        /* Estilo do Botão Voltar igual às outras abas */
        .btn-back {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: sans-serif;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* Container de Lista igual ao magias.html */
        .list-container {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: var(--card-color);
            margin-bottom: 20px;
        }

        .section-header {
            background: var(--accent-color);
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        /* Stats de Carga */
        .weight-info {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .weight-bar {
            background: #eee;
            height: 12px;
            border-radius: 6px;
            margin-top: 8px;
            overflow: hidden;
            border: 1px solid #ccc;
        }
        #weight-fill { 
            background: var(--accent-color); 
            height: 100%; 
            width: 0%; 
            transition: width 0.5s ease-in-out; 
        }

        /* Itens do Inventário */
        .item-card {
            border-bottom: 1px solid #eee;
            padding: 12px 15px;
        }
        .item-card:last-child { border-bottom: none; }
        .item-row { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        .item-desc { font-size: 0.9rem; color: #555; font-style: italic; margin-bottom: 8px; }
        .item-actions { display: flex; gap: 8px; }

        .btn-action {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: sans-serif;
        }
        .btn-action:hover { background: #e0e0e0; }

        /* Log de Rolagens (Sincronizado com magias.html) */
        .log-container {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-color);
            margin-top: 20px;
        }
        #dice-log {
            height: 250px;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .log-entry {
            background: #f9f9f9;
            border: 1px solid #eee;
            padding: 8px;
            border-radius: 4px;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: var(--accent-color);
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
        .log-details { font-size: 0.8rem; color: #666; }
        .log-result { font-weight: bold; font-size: 0.95rem; margin-top: 2px; }

        /* Modais */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            border: 2px solid var(--accent-color);
        }
        .modal-content h3 { margin-top: 0; color: var(--accent-color); }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <a href="#" id="link-voltar" class="btn-back">← Voltar para Ficha</a>

    <div class="list-container">
        <div class="section-header">
            <span id="nome-personagem">Carregando Inventário...</span>
            <button onclick="window.abrirModalNovoItem()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">+</button>
        </div>

        <div class="weight-info">
            <div style="display:flex; justify-content:space-between; font-weight:bold;">
                <span>Carga Atual</span>
                <span><span id="current-weight">0</span> / <span id="max-weight">75</span> kg</span>
            </div>
            <div class="weight-bar">
                <div id="weight-fill"></div>
            </div>
        </div>

        <div id="lista-inventario">
            </div>
    </div>

    <div class="log-container">
        <div class="section-header" style="font-size: 0.9rem;">
            <span>LOG DE ROLAGENS</span>
            <button onclick="window.limparLog()" style="background:none; border:1px solid white; color:white; font-size:0.7rem; cursor:pointer; padding:2px 5px; border-radius:3px;">LIMPAR MEU LOG</button>
        </div>
        <div id="dice-log"></div>
    </div>

    <div id="modal-item" class="modal">
        <div class="modal-content">
            <input type="hidden" id="item-id-edicao">
            <h3 id="modal-titulo">Novo Item</h3>
            <input type="text" id="item-nome" placeholder="Nome do Item (ex: Espada Longa)">
            <textarea id="item-desc" placeholder="Descrição ou Função" rows="3"></textarea>
            <input type="number" id="item-peso" placeholder="Peso em kg (ex: 2.5)" step="0.1">
            
            <div style="background:#eee; padding:10px; border-radius:4px; margin: 10px 0;">
                <label style="font-size:0.9rem; font-weight:bold; display:block; margin-bottom:5px;">
                    <input type="checkbox" id="item-tem-ataque" onchange="document.getElementById('config-ataque').style.display = this.checked ? 'block' : 'none'"> Possui Rolagem de Ataque?
                </label>
                <div id="config-ataque" style="display:none; margin-top:10px; border-top:1px solid #ccc; padding-top:10px;">
                    <label style="font-size:0.85rem;">Atributo do Ataque:</label>
                    <select id="item-attr-ataque" style="margin-bottom:10px; padding:5px; width:100%;">
                        <option value="">Nenhum</option>
                        <option value="forca">Força</option>
                        <option value="destreza">Destreza</option>
                        <option value="inteligencia">Inteligência</option>
                        <option value="sabedoria">Sabedoria</option>
                        <option value="carisma">Carisma</option>
                    </select>
                    <label style="font-size:0.85rem; font-weight:bold;">
                        <input type="checkbox" id="item-prof-ataque"> Somar Bônus de Proficiência?
                    </label>
                </div>
            </div>
            
            <div style="background:#eee; padding:10px; border-radius:4px; margin: 10px 0;">
                <label style="font-size:0.9rem; font-weight:bold; display:block; margin-bottom:5px;">Rolagens de Dano</label>
                <div id="lista-danos-item"></div>
                <button onclick="window.addLinhaDanoItem()" style="background:var(--accent-color); color:white; border:none; padding:5px 10px; border-radius:4px; font-size:0.8rem; cursor:pointer; margin-top:5px;">+ Adicionar Dano</button>
            </div>

            <div style="display:flex; gap:10px; margin-top:15px;">
                <button onclick="window.salvarItem()" style="flex:1; background:var(--accent-color); color:white; border:none; padding:10px; border-radius:4px; font-weight:bold; cursor:pointer;">SALVAR</button>
                <button onclick="window.fecharModal()" style="flex:1; background:#ccc; border:none; padding:10px; border-radius:4px; cursor:pointer;">CANCELAR</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, limit, deleteDoc, getDocs, where, updateDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        // COLOQUE SEU CONFIG AQUI
        const firebaseConfig = {
            apiKey: "AIzaSyCNnl95-aJGntyBdGP8g4jqIue_tYbLcek",
            authDomain: "dedvtt-77.firebaseapp.com",
            projectId: "dedvtt-77",
            storageBucket: "dedvtt-77.firebasestorage.app",
            messagingSenderId: "372808860116",
            appId: "1:372808860116:web:ff19b425c957084c0a1641"
         };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const FICHA_ID = params.get('id');
        document.getElementById('link-voltar').href = `ficha.html?id=${FICHA_ID}`;

        // --- FUNÇÕES DE INVENTÁRIO ---

        window.abrirModalNovoItem = function() {
            window.fecharModal(); 
            document.getElementById('modal-titulo').textContent = "Novo Item";
            window.rolagensDanoItemAtual = []; // Reseta os danos
            window.renderDanosItemAtual();
            document.getElementById('modal-item').style.display = 'flex';
        };
        
        window.fecharModal = function() {
            document.getElementById('modal-item').style.display = 'none';
            document.getElementById('item-id-edicao').value = '';
            document.getElementById('item-nome').value = '';
            document.getElementById('item-desc').value = '';
            document.getElementById('item-peso').value = '';
            document.getElementById('item-tem-ataque').checked = false;
            document.getElementById('item-attr-ataque').value = '';
            document.getElementById('item-prof-ataque').checked = false;
            document.getElementById('config-ataque').style.display = 'none';
        };

        window.abrirModalEditar = function(id) {
            const item = window.itensInventario[id]; 
            if(!item) return;

            document.getElementById('item-id-edicao').value = id;
            document.getElementById('item-nome').value = item.nome;
            document.getElementById('item-desc').value = item.desc || "";
            document.getElementById('item-peso').value = item.peso || 0;
            
            // Dados do Ataque
            document.getElementById('item-tem-ataque').checked = item.temAtaque || false;
            document.getElementById('item-attr-ataque').value = item.attrAtaque || '';
            document.getElementById('item-prof-ataque').checked = item.profAtaque || false;
            document.getElementById('config-ataque').style.display = item.temAtaque ? 'block' : 'none';
            
            window.rolagensDanoItemAtual = item.rolagensDano ? JSON.parse(JSON.stringify(item.rolagensDano)) : [];
            window.renderDanosItemAtual();
            
            document.getElementById('modal-titulo').textContent = "Editar Item";
            document.getElementById('modal-item').style.display = 'flex';
        };

        // Função de Rolar Ataque
        window.rolarAtaqueItem = async (id) => {
            const item = window.itensInventario[id];
            const d20 = Math.floor(Math.random() * 20) + 1;
            window.enviarRolagem(`Ataque: ${item.nome}`, `Rolagem d20 (${d20})`, d20);
        };

        // Função de Salvar atualizada para suportar Create e Update
        window.salvarItem = async function() {
            const idEdicao = document.getElementById('item-id-edicao').value;
            const nome = document.getElementById('item-nome').value;
            const desc = document.getElementById('item-desc').value;
            const peso = parseFloat(document.getElementById('item-peso').value) || 0;
            const temAtaque = document.getElementById('item-tem-ataque').checked;
            
            if(!nome) return;

            const dadosItem = {
                nome, desc, peso, temAtaque, 
                attrAtaque: document.getElementById('item-attr-ataque').value,
                profAtaque: document.getElementById('item-prof-ataque').checked,
                rolagensDano: window.rolagensDanoItemAtual,
                timestamp: serverTimestamp()
            };

            try {
                if (idEdicao) await updateDoc(doc(db, `fichas/${FICHA_ID}/inventario/${idEdicao}`), dadosItem);
                else await addDoc(collection(db, `fichas/${FICHA_ID}/inventario`), dadosItem);
                window.fecharModal();
            } catch (e) { console.error("Erro ao salvar:", e); }
        };

        // Função auxiliar para limpar e fechar o modal

        // Variável que guarda os danos enquanto você edita o item
        window.rolagensDanoItemAtual = [];

        // Adiciona uma nova linha em branco de dano
        window.addLinhaDanoItem = function(dano = { qtd: 1, dado: 'd8', bonus: 0, tipo: 'Cortante' }) {
            window.rolagensDanoItemAtual.push(dano);
            window.renderDanosItemAtual();
        };

        // Remove uma linha de dano
        window.removerDanoItem = function(idx) {
            window.rolagensDanoItemAtual.splice(idx, 1);
            window.renderDanosItemAtual();
        };

        // Desenha as caixas de dano na tela com seletor de Atributo
        window.renderDanosItemAtual = function() {
            const container = document.getElementById('lista-danos-item');
            container.innerHTML = '';
            window.rolagensDanoItemAtual.forEach((d, idx) => {
                container.innerHTML += `
                    <div style="display:flex; gap:5px; margin-bottom:5px; align-items:center; flex-wrap: wrap;">
                        <input type="number" value="${d.qtd}" style="width:40px; padding:4px; margin:0;" onchange="window.updateDanoItem(${idx}, 'qtd', this.value)" title="Qtd">
                        <select style="padding:4px; margin:0;" onchange="window.updateDanoItem(${idx}, 'dado', this.value)">
                            <option value="d4" ${d.dado==='d4'?'selected':''}>d4</option>
                            <option value="d6" ${d.dado==='d6'?'selected':''}>d6</option>
                            <option value="d8" ${d.dado==='d8'?'selected':''}>d8</option>
                            <option value="d10" ${d.dado==='d10'?'selected':''}>d10</option>
                            <option value="d12" ${d.dado==='d12'?'selected':''}>d12</option>
                            <option value="d20" ${d.dado==='d20'?'selected':''}>d20</option>
                        </select>
                        <span style="font-weight:bold;">+</span>
                        <input type="number" value="${d.bonus || 0}" style="width:50px; padding:4px; margin:0;" onchange="window.updateDanoItem(${idx}, 'bonus', this.value)" title="Bônus Fixo">
                        <input type="text" value="${d.tipo || ''}" style="width:70px; padding:4px; margin:0;" placeholder="Tipo" onchange="window.updateDanoItem(${idx}, 'tipo', this.value)">
                        
                        <select style="padding:4px; margin:0; width:100px;" onchange="window.updateDanoItem(${idx}, 'atributo', this.value)">
                            <option value="" ${!d.atributo?'selected':''}>Mod: Não</option>
                            <option value="forca" ${d.atributo==='forca'?'selected':''}>+ Força</option>
                            <option value="destreza" ${d.atributo==='destreza'?'selected':''}>+ Destreza</option>
                            <option value="inteligencia" ${d.atributo==='inteligencia'?'selected':''}>+ Int.</option>
                            <option value="sabedoria" ${d.atributo==='sabedoria'?'selected':''}>+ Sab.</option>
                            <option value="carisma" ${d.atributo==='carisma'?'selected':''}>+ Caris.</option>
                        </select>

                        <button onclick="window.removerDanoItem(${idx})" style="background:none; border:none; color:red; cursor:pointer;">❌</button>
                    </div>
                `;
            });
        };

        // Atualiza a memória quando você digita algo nas caixas de dano
        window.updateDanoItem = function(idx, campo, valor) {
            if(campo === 'qtd' || campo === 'bonus') valor = parseInt(valor) || 0;
            window.rolagensDanoItemAtual[idx][campo] = valor;
        };

       // Guarda os itens carregados para podermos acessar sem quebrar o HTML
        window.itensInventario = {};

        // Ouvir itens e calcular peso
        onSnapshot(collection(db, `fichas/${FICHA_ID}/inventario`), (snapshot) => {
            const lista = document.getElementById('lista-inventario');
            lista.innerHTML = '';
            let pesoTotal = 0;
            
            // Limpa a lista a cada atualização
            window.itensInventario = {}; 

            snapshot.forEach(docSnap => {
                const item = docSnap.data();
                const id = docSnap.id;
                pesoTotal += item.peso;
                
                // Salva o item na memória usando o ID como chave
                window.itensInventario[id] = item;

                lista.innerHTML += `
                    <div class="item-card">
                        <div class="item-row">
                            <span>${item.nome}</span>
                            <span>${item.peso} kg</span>
                        </div>
                        ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
                        <div class="item-actions">
                            ${item.temAtaque ? `<button class="btn-action" onclick="window.rolarAtaqueItem('${id}')">Ataque</button>` : ''}
                            
                            ${(item.rolagensDano || []).map((d, i) => `
                                <button class="btn-action" onclick="window.rolarDanoItem('${id}', ${i})">
                                    Dano (${d.qtd}${d.dado}${d.bonus > 0 ? '+'+d.bonus : d.bonus < 0 ? d.bonus : ''} ${d.atributo})
                                </button>
                            `).join('')}
                            
                            <div style="margin-left:auto; display:flex; gap:10px;">
                                <button onclick="window.abrirModalEditar('${id}')" style="background:none; border:none; cursor:pointer; font-size:1rem;">✏️</button>
                                <button onclick="window.removerItem('${id}')" style="background:none; border:none; cursor:pointer; font-size:1rem;">🗑️</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('current-weight').textContent = pesoTotal.toFixed(1);
            
            // Chama a nova função em vez da lógica antiga fixa!
            window.atualizarBarraPeso();
        });

        window.removerItem = async (id) => { 
            if(confirm("Deseja remover este item?")) await deleteDoc(doc(db, `fichas/${FICHA_ID}/inventario/${id}`)); 
        };

        // --- ROLAGENS E LOG ---
        window.enviarRolagem = async (acao, detalhes, resultado) => {
            const nomePers = document.getElementById('nome-personagem').textContent;
            await addDoc(collection(db, 'rolagens'), {
                personagem: nomePers, 
                nome: acao, 
                detalhes, 
                resultado, 
                fichaId: FICHA_ID, // Para o filtro de limpar log
                timestamp: Date.now()
            });
        };

        // Função de Rolar Dano
        window.rolarDanoItem = async (id, idxDano) => {
            const item = window.itensInventario[id];
            const d = item.rolagensDano[idxDano];
            
            let total = 0;
            let rolagens = [];
            const faces = parseInt(d.dado.replace('d', ''));
            
            for(let i=0; i < d.qtd; i++) {
                const r = Math.floor(Math.random() * faces) + 1;
                rolagens.push(r);
                total += r;
            }
            total += (d.bonus || 0); // Adiciona o bônus ao final
            
            const txtBonus = d.bonus > 0 ? `+${d.bonus}` : d.bonus < 0 ? `${d.bonus}` : '';
            const desc = `${d.qtd}${d.dado}${txtBonus} ${d.tipo}`;
            
            window.enviarRolagem(`Dano: ${item.nome}`, `${desc} [${rolagens.join(',')}]`, total);
        };

        let primeiraCargaLog = true;
        onSnapshot(query(collection(db, 'rolagens'), orderBy("timestamp", "desc"), limit(25)), (snapshot) => {
            const el = document.getElementById('dice-log');
            el.innerHTML = '';
            snapshot.forEach(docSnap => {
                const d = docSnap.data();
                el.innerHTML += `
                    <div class="log-entry">
                        <div class="log-header"><span>${d.personagem}</span><span>${d.nome}</span></div>
                        <div class="log-details">${d.detalhes}</div>
                        <div class="log-result">Total: ${d.resultado}</div>
                    </div>
                `;
            });
            if (!primeiraCargaLog) {
                const logContainer = document.querySelector('.log-container');
                logContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            primeiraCargaLog = false;
        });

        window.limparLog = async function() {
            if(confirm("Limpar suas rolagens deste log?")) {
                const q = query(collection(db, 'rolagens'), where("fichaId", "==", FICHA_ID));
                const snap = await getDocs(q);
                snap.forEach(d => deleteDoc(d.ref));
            }
        };

       // Guarda os atributos para usar nas rolagens
        window.atributosPersonagem = {};
        window.proficienciaPersonagem = 2;

        // Carregar Ficha: Nome, Força, Atributos e Tamanho
        getDoc(doc(db, "fichas", FICHA_ID)).then(d => {
            if(d.exists()) {
                const data = d.data();
                document.getElementById('nome-personagem').textContent = data.nome || "Desconhecido";
                
                // Salva atributos globais
                window.atributosPersonagem = data.atributos || {};
                
                // Tenta puxar a proficiência salva ou calcula baseada no nível (1 ao 4 = +2, 5 ao 8 = +3...)
                window.proficienciaPersonagem = parseInt(data.profBonus);

                // 1. Procurar a Força para o peso
                let forca = 10; 
                if (data.atributos) {
                    if (Array.isArray(data.atributos)) {
                        const attrFor = data.atributos.find(a => a.nome.toLowerCase() === 'força' || a.nome.toLowerCase() === 'forca' || a.nome.toLowerCase() === 'for');
                        if (attrFor) forca = parseInt(attrFor.valor) || 10;
                    } else {
                        forca = parseInt(data.atributos.forca || data.atributos.Força || data.atributos.FOR) || 10;
                    }
                }

                // 2. Procurar o Tamanho e definir o Multiplicador
                let tamanho = (data.tamanho || "médio").toLowerCase();
                let multiplicador = 15; 

                if (tamanho.includes("miúdo") || tamanho.includes("miudo")) multiplicador = 7.5;
                else if (tamanho.includes("grande")) multiplicador = 30;
                else if (tamanho.includes("enorme")) multiplicador = 60;
                else if (tamanho.includes("imenso")) multiplicador = 120;
                else if (tamanho.includes("colossal")) multiplicador = 240;

                // 3. Calcula a Carga Máxima
                const cargaMaxima = forca * multiplicador; 
                document.getElementById('max-weight').textContent = cargaMaxima;
                window.atualizarBarraPeso();
            }
        });

        //Função para atualizar a barra visual dinamicamente
        window.atualizarBarraPeso = function() {
            const pesoTotal = parseFloat(document.getElementById('current-weight').textContent) || 0;
            const max = parseFloat(document.getElementById('max-weight').textContent) || 1;
            const porc = Math.min((pesoTotal / max) * 100, 100);
            const barra = document.getElementById('weight-fill');
            
            barra.style.width = porc + '%';
            
            // Se o peso passar do limite, a barra fica vermelha escura para alertar o jogador!
            if (pesoTotal > max) {
                barra.style.background = "darkred";
            } else {
                barra.style.background = "var(--accent-color)";
            }
        };

        // Extrai o modificador de um atributo (ex: 16 de força = +3)
        window.getModificador = function(attrBusca) {
            if (!attrBusca) return 0;
            let valor = 10;
            // Procura o atributo pelas três primeiras letras para não ter problemas com acentos (ex: "for")
            const termo = attrBusca.substring(0,3).toLowerCase();
            
            if (Array.isArray(window.atributosPersonagem)) {
                const attr = window.atributosPersonagem.find(a => a.nome.toLowerCase().includes(termo));
                if (attr) valor = parseInt(attr.valor) || 10;
            } else {
                const chave = Object.keys(window.atributosPersonagem).find(k => k.toLowerCase().includes(termo));
                if (chave) valor = parseInt(window.atributosPersonagem[chave]) || 10;
            }
            return Math.floor((valor - 10) / 2);
        };

        // Rolagem de Ataque
        window.rolarAtaqueItem = async (id) => {
            const item = window.itensInventario[id];
            const d20 = Math.floor(Math.random() * 20) + 1;
            
            let mod = 0;
            let prof = 0;
            let detalhes = `d20(${d20})`;

            if (item.attrAtaque) {
                mod = window.getModificador(item.attrAtaque);
                detalhes += ` + ${item.attrAtaque.substring(0,3).toUpperCase()}(${mod})`;
            }
            if (item.profAtaque) {
                prof = window.proficienciaPersonagem || 2;
                detalhes += ` + Prof(${prof})`;
            }

            const total = d20 + mod + prof;
            window.enviarRolagem(`Ataque: ${item.nome}`, detalhes, total);
        };

        // Rolagem de Dano
        window.rolarDanoItem = async (id, idxDano) => {
            const item = window.itensInventario[id];
            const d = item.rolagensDano[idxDano];
            
            let total = 0;
            let rolagens = [];
            const faces = parseInt(d.dado.replace('d', ''));
            
            for(let i=0; i < d.qtd; i++) {
                const r = Math.floor(Math.random() * faces) + 1;
                rolagens.push(r);
                total += r;
            }

            // Calcula o Modificador do Atributo se escolhido
            let modAttr = 0;
            let textoMod = '';
            if (d.atributo) {
                modAttr = window.getModificador(d.atributo);
                textoMod = modAttr >= 0 ? `+Mod(${modAttr})` : `${modAttr}`;
            }

            total += (d.bonus || 0) + modAttr;
            
            const txtBonus = d.bonus > 0 ? `+${d.bonus}` : d.bonus < 0 ? `${d.bonus}` : '';
            const desc = `${d.qtd}${d.dado}${txtBonus} ${textoMod} ${d.tipo}`;
            
            window.enviarRolagem(`Dano: ${item.nome}`, `${desc} [${rolagens.join(',')}]`, total);
        };

    </script>
</body>
</html>
